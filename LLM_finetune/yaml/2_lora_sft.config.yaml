### LoRA SFT Training Config
### Usage: FORCE_TORCHRUN=1 llamafactory-cli train yaml/2_lora_sft.config.yaml

### Model
model_name_or_path: ${PROJECT_PATH}/model/qwen3-8b

### LoRA
finetuning_type: lora
lora_rank: 8
lora_target: all

### DeepSpeed
deepspeed: ${PROJECT_PATH}/LLM_finetune/deepspeed/ds_z2_config.json

### Dataset
stage: sft
dataset: asr_correction_train
eval_dataset: asr_correction_val
dataset_dir: ${PROJECT_PATH}/LLM_finetune
template: qwen3
cutoff_len: 4096
preprocessing_num_workers: 32

### Training
per_device_train_batch_size: 8
gradient_accumulation_steps: 2
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true

### Evaluation
per_device_eval_batch_size: 8
eval_strategy: steps
eval_steps: 300

### Logging
logging_steps: 10
plot_loss: true

### Saving
save_strategy: steps
save_steps: 300
save_total_limit: 3

### Output
output_dir: ${PROJECT_PATH}/trained_model/qwen3-8b-asr-adapter
overwrite_output_dir: true
